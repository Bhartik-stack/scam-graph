spring.application.name=ScamGraph
server.port=8080

# In-memory H2 database (no installation needed). Data resets when the app restarts.
spring.datasource.url=jdbc:h2:mem:scamgraph;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500

# Database viewer at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:scamgraph   user: sa   password: (empty)
spring.h2.console.enabled=true

# Allow CSV uploads up to 20 MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.jackson.serialization.indent-output=false
